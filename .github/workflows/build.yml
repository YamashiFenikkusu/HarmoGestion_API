name: SonarQube
on:
    push:
        branches:
            - cicd
            - main
    pull_request:
        types: [opened, synchronize, reopened]
jobs:
    build:
        name: Build et analyse
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: 25
                  distribution: 'zulu' # Alternative distribution options are available.
            - name: Cache SonarQube packages
              uses: actions/cache@v5
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar
            - name: Cache Maven packages
              uses: actions/cache@v5
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2
            - name: Build and analyze
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=YamashiFenikkusu_HarmoGestion_API
            - name: Artefact
              uses: actions/upload-artifact@v4
              with:
                  name: package.jar
                  path: target/*.jar
                  retention-days: 1
    docker-build-image-api:
        name: Construction image Docker
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            -   uses: actions/checkout@v5
            -   name: Connexion à Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USER }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }}
            -   name: Téléchargement d'un artefact
                uses: actions/download-artifact@v4
                with:
                    name: package.jar
            -   name: Build et pousse
                uses: docker/build-push-action@v5
                with:
                    context: .
                    file: Dockerfile
                    push: true
                    tags: ${{ secrets.DOCKERHUB_USER }}/harmogestion-api:latest
            -   run: echo "Image poussée sur DockerHub avec succès"